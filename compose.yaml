services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-santoto_launch}
      MARIADB_USER: ${DB_USER:-santoto_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-local-root-development-only}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - launch_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  launch_mariadb_data:
